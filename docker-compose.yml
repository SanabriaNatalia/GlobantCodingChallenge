version: '3.8'
services:
  api:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - type: bind
        source: ./app
        target: /app
#    env_file:
#      - .env
    networks:
      - net
    command: uvicorn main:app --host 0.0.0.0 --port 8081

volumes:
  index_data:
    driver: local
  backups:
    driver: local

networks:
  net:
    driver: bridge
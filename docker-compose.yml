version: '3.8'
services:
  api:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - type: bind
        source: ./app
        target: /app
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - net

  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
    ports:
      - 5432:5432
    expose:
      - 5432
    networks:
      - net

volumes:
  dev-db-data:
    driver: local

networks:
  net:
    driver: bridge